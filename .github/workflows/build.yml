name: Build ChaosClient 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair projeto Fabric
        run: unzip -q chaosclient-lunar.zip

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verificar versões
        working-directory: chaosclient-lunar
        run: |
          grep -E 'minecraft_version|yarn_mappings|loader_version|loom_version|fabric_version' gradle.properties
          test -f build.gradle
          test -f gradlew
          test -f src/main/resources/fabric.mod.json

      - name: Compilar JAR
        working-directory: chaosclient-lunar
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: chaosclient-1.21.11
          path: chaosclient-lunar/build/libs/*.jar
          if-no-files-found: error
