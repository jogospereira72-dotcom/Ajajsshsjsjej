name: Build ChaosClient 1.21.11

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Garantir permissões
        run: chmod +x ./gradlew

      - name: Compilar Minecraft 1.21.11
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
